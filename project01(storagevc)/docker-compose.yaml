services:
  matcher-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - HOST=qDrant-DB
      - PORT=6333
      - COLLECTION_NAME=linkedIn_jobs
    volumes:
      - .:/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qDrant-DB

  qDrant-DB:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qDrant/qdrant_data:/qdrant/storage

    